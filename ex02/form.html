<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Formulaire de contact</title>
</head>
<body>
  <h1>Formulaire de contact</h1>

  <form>
    <label>Firstname :</label>
    <input type="text" id="firstname" name="firstname" required><br>

    <label>Name :</label>
    <input type="text" id="name" name="name" required><br>

    <label>Age :</label>
    <input type="number" id="age" name="age" required><br>

    <label>Phone :</label>
    <input type="tel" id="phone" name="phone" required><br>

    <label>Email :</label>
    <input type="email" id="email" name="email" required><br>

    <label>
        Student at 42 ?
      <input type="checkbox" id="student" name="student"> 
    </label><br>

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" id="gender_male" name="gender" value="Male"> Male</label>
      <label><input type="radio" id="gender_female" name="gender" value="Female"> Female</label>
      <label><input type="radio" id="gender_other" name="gender" value="Other"> Other</label>
    </fieldset><br>

    <button type="button" onclick="displayFormContents();">Submit</button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
